[package]
name = "mod-adapter-core"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Universal zero-JVM mod adapter, declarative offload profile engine, and 4-tier fallback planner on mod-offload"
publish = false

[dependencies]
mc_spine_core = { package = "mc-spine-core", path = "../core" }
mod-offload = { path = "../mod-offload" }

[[bin]]
name = "mc-spine-mod-check"
path = "src/bin/mod_check.rs"
