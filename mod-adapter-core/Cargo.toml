[package]
name = "mod-adapter-core"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Universal zero-JVM mod adapter, declarative offload profile engine, and 4-tier fallback planner on mod-offload"
publish = false

[dependencies]
megu_core = { package = "megu-core", path = "../core" }
mod-offload = { path = "../mod-offload" }

# Dev-only: the cross-mod spine interop tests drive a real `.wasm` guest
# through `SpineRevHost` so Fabric/NeoForge/mod-offload/WASM provably
# share one ModSpineHost. Path-local, zero crates.io deps, no cycle:
# wasm-mod-runtime depends only on megu-core.
[dev-dependencies]
megu-wasm-mod-runtime = { path = "../wasm-mod-runtime" }

[[bin]]
name = "megu-mod-check"
path = "src/bin/mod_check.rs"

# Standalone manifest: the root `[profile.release]` is not inherited, so the
# shipped binary opts into full optimisation, LTO and symbol stripping itself.
[profile.release]
opt-level = 3
lto = true
strip = true
