[package]
name = "megu-kernel"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Standalone protocol-767 kernel and versioned C ABI for megu"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

# Zero external dependencies by contract: this crate is the protocol-767
# kernel both the client (`client-app`) and C FFI consumers share, so it must
# build on pure `std`. `megu-core` is the in-repo leaf crate (also
# zero-dependency) that owns the canonical 1.21.1/26.3 `TargetVersion`/
# `VersionMeta` constants and the validated `ResourceLocation` this crate
# exposes, the 1.21.1 fluid math (`entity_fluid`) the kernel predicts with, and
# the protocol-767 paletted section (`paletted`) the server chunk writer and
# this kernel both emit — still no crates.io dependencies.
[dependencies]
megu_core = { package = "megu-core", path = "../core" }

# Standalone manifest: the root `[profile.release]` is not inherited, so the
# shipped binary opts into full optimisation, LTO and symbol stripping itself.
[profile.release]
opt-level = 3
lto = true
strip = true
