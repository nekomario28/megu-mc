<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Megu — Native Rust + wgpu Minecraft 1.21.1 Engine</title>
  <desc id="desc">Open-source LGPL-3.0 Minecraft: Java Edition 1.21.1 client and server written in Rust + wgpu. Measured server memory: 122 MiB vs Vanilla 1,168 MiB (9.6x less RAM).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0910"/>
      <stop offset="0.58" stop-color="#120f18"/>
      <stop offset="1" stop-color="#19131f"/>
    </linearGradient>
    <radialGradient id="glow-red" cx="0.18" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#d6323f" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#7c1420" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0b0910" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="0.82" cy="0.26" r="0.5">
      <stop offset="0" stop-color="#f0b84c" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#d6323f" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0b0910" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08c"/>
      <stop offset="0.55" stop-color="#f0b84c"/>
      <stop offset="1" stop-color="#e34b57"/>
    </linearGradient>
    <linearGradient id="bar-crimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b84c"/>
      <stop offset="1" stop-color="#d6323f"/>
    </linearGradient>
    <linearGradient id="megu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1824"/>
      <stop offset="1" stop-color="#0d0b11"/>
    </linearGradient>
    <linearGradient id="megu-crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f24956"/>
      <stop offset="1" stop-color="#a81b2a"/>
    </linearGradient>
    <linearGradient id="megu-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe599"/>
      <stop offset="0.55" stop-color="#f0b84c"/>
      <stop offset="1" stop-color="#c9841e"/>
    </linearGradient>
  </defs>

  <!-- Canvas & In'ei ambient lighting -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-red)"/>
  <rect width="1200" height="630" fill="url(#glow-gold)"/>

  <!-- Subtle architectural frame lines -->
  <g stroke="#2a2133" stroke-width="1" opacity="0.65">
    <path d="M0 545 H1200"/>
    <path d="M740 0 V545"/>
  </g>

  <!-- Brand mark (Crystal Core D) + Name -->
  <g transform="translate(76, 66) scale(0.74)">
    <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#megu-bg)" stroke="#44324b" stroke-width="3.2"/>
    <polygon points="64,18 90,44 76,44 64,32 52,44 38,44" fill="url(#megu-crimson)"/>
    <polygon points="110,64 84,90 84,76 96,64 84,52 84,38" fill="#b41e2e"/>
    <polygon points="64,110 38,84 52,84 64,96 76,84 90,84" fill="#8b1523"/>
    <polygon points="18,64 44,38 44,52 32,64 44,76 44,90" fill="#d93341"/>
    <polygon points="64,40 88,64 64,88 40,64" fill="url(#megu-gold)"/>
    <polygon points="64,40 88,64 64,64" fill="#fff6d6" fill-opacity="0.48"/>
    <polygon points="64,53 75,64 64,75 53,64" fill="#141019"/>
  </g>

  <text x="192" y="114" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f6f3f9" letter-spacing="-1.5">Megu</text>
  <rect x="352" y="76" width="290" height="36" rx="18" fill="#1a1421" stroke="#3c2b44"/>
  <text x="497" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#f0b84c" letter-spacing="0.8">MINECRAFT ENGINE IN RUST</text>
  <text x="194" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#9b91ab">Native Client &amp; Server · Pure wgpu (Vulkan / DX12 / Metal)</text>

  <!-- Main headline -->
  <text x="76" y="254" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Minecraft 1.21.1,</text>
  <text x="76" y="322" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">Rebuilt in Rust.</text>

  <text x="76" y="382" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c4bdd0">Open-source LGPL-3.0 client &amp; server · Pure wgpu</text>
  <text x="76" y="416" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9288a3">NeoForge &amp; Fabric modpack inspection · No OpenGL</text>

  <!-- Bottom pills -->
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700">
    <rect x="76" y="460" width="144" height="46" rx="23" fill="#191421" stroke="#3e2c46"/>
    <text x="148" y="490" text-anchor="middle" fill="#f0b84c">1.21.1</text>

    <rect x="236" y="460" width="166" height="46" rx="23" fill="#191421" stroke="#3e2c46"/>
    <text x="319" y="490" text-anchor="middle" fill="#f25965">Pure wgpu</text>

    <rect x="418" y="460" width="154" height="46" rx="23" fill="#191421" stroke="#3e2c46"/>
    <text x="495" y="490" text-anchor="middle" fill="#52cf93">LGPL-3.0</text>
  </g>

  <!-- Right-side Vanilla comparison card (RAM only — clean & intuitive) -->
  <g transform="translate(772, 74)">
    <rect x="0" y="0" width="356" height="418" rx="18" fill="#14101a" stroke="#35273e" stroke-width="2"/>
    <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#9a8fab" letter-spacing="1">VS VANILLA 1.21.1 (SERVER)</text>

    <text x="28" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="68" font-weight="800" fill="#f0b84c" letter-spacing="-2.5">9.6×</text>
    <text x="28" y="170" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f6f3f9">Less RAM Used</text>

    <!-- Divider -->
    <line x1="28" y1="202" x2="328" y2="202" stroke="#282032" stroke-width="1.5"/>

    <!-- Megu bar -->
    <text x="28" y="246" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f6f3f9">Megu (Rust)</text>
    <text x="328" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#f0b84c">122 MiB</text>
    <rect x="28" y="260" width="300" height="18" rx="9" fill="#211a2b"/>
    <rect x="28" y="260" width="36" height="18" rx="9" fill="url(#bar-crimson)"/>

    <!-- Vanilla bar -->
    <text x="28" y="318" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a89eb8">Vanilla 1.21.1</text>
    <text x="328" y="318" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#a89eb8">1,168 MiB</text>
    <rect x="28" y="332" width="300" height="18" rx="9" fill="#41374f"/>

    <!-- Footer note inside card -->
    <text x="28" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#7c718c">Same PC · 20s movement load · 3-run mean</text>
  </g>

  <!-- Footer bar -->
  <text x="76" y="594" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#f3eff8">megu.megumin.tech</text>
  <text x="1128" y="594" text-anchor="end" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b809c">Linux · Windows · macOS</text>
</svg>
