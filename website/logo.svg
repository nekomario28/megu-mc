<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Megu logo">
  <defs>
    <linearGradient id="megu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1824"/>
      <stop offset="1" stop-color="#0d0b11"/>
    </linearGradient>
    <radialGradient id="megu-aura" cx="0.5" cy="0.5" r="0.46">
      <stop offset="0" stop-color="#f0b84c" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#d6323f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0d0b11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="megu-crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f24956"/>
      <stop offset="1" stop-color="#a81b2a"/>
    </linearGradient>
    <linearGradient id="megu-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe599"/>
      <stop offset="0.55" stop-color="#f0b84c"/>
      <stop offset="1" stop-color="#c9841e"/>
    </linearGradient>
  </defs>
  <!-- Obsidian rounded badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#megu-bg)" stroke="#3a2b40" stroke-width="3"/>
  <circle cx="64" cy="64" r="46" fill="url(#megu-aura)"/>
  <!-- Outer 4-shard crimson crystal frame -->
  <polygon points="64,18 90,44 76,44 64,32 52,44 38,44" fill="url(#megu-crimson)"/>
  <polygon points="110,64 84,90 84,76 96,64 84,52 84,38" fill="#b41e2e"/>
  <polygon points="64,110 38,84 52,84 64,96 76,84 90,84" fill="#8b1523"/>
  <polygon points="18,64 44,38 44,52 32,64 44,76 44,90" fill="#d93341"/>
  <!-- Center golden diamond core -->
  <polygon points="64,40 88,64 64,88 40,64" fill="url(#megu-gold)"/>
  <polygon points="64,40 88,64 64,64" fill="#fff6d6" fill-opacity="0.48"/>
  <!-- Inner obsidian center aperture (In'ei shadow core) -->
  <polygon points="64,53 75,64 64,75 53,64" fill="#141019"/>
</svg>
