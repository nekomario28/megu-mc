[package]
name = "megu-client-gpu"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Standalone real windowed GPU client for megu (winit + wgpu)"
publish = false

[lib]
name = "megu_client_gpu"
path = "src/lib.rs"

[[bin]]
name = "megu-client-gpu"
path = "src/main.rs"

# Zero-bloat release contract: this manifest produces the shipped GUI client
# binary, so release builds are fully optimized, LTO'd and stripped.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"
codegen-units = 8
incremental = false

[profile.test]
debug = "line-tables-only"
codegen-units = 4
incremental = false

[dependencies]
megu_client = { package = "megu-client", path = "../client-app" }
megu_client_mesh = { package = "megu-client-mesh", path = "../client-port" }
megu_core = { package = "megu-core", path = "../core" }
megu_kernel = { package = "megu-kernel", path = "../client-kernel" }
megu_proto = { package = "megu-proto", path = "../proto" }
megu_ui = { package = "megu-client-ui", path = "../client-ui" }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
# Vanilla client-JAR bootstrap: Mojang manifest fetch + SHA-1-verified
# download over pure-Rust rustls — identical on Linux/macOS/Windows, zero
# OpenSSL anywhere in the graph. Version/features match the root crate.
ureq = { version = "3.4.2", features = ["rustls"] }
# Pure-wgpu policy: no OpenGL/GLES/EGL/WGL anywhere in the dependency graph.
# Each OS compiles only its native primary backend(s), so `glow`,
# `khronos-egl` and `glutin_wgl_sys` never enter the build.
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "std"] }
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }
