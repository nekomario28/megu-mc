[package]
name = "megu-client-mesh"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Standalone protocol-767 voxel section mesher for megu"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

# Zero external dependencies by contract: `megu-core` is the in-repo leaf
# crate (also zero-dependency) that owns the shared `diff_engine`
# primitives `cache.rs` wires into its dirty tracking — still no crates.io
# dependencies.
[dependencies]
megu_core = { package = "megu-core", path = "../core" }

[profile.release]
opt-level = 3
lto = true
strip = true
