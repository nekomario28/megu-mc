[package]
name = "palette-bench"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
# build.rs inlines src/paletted.rs, which calls megu_core::bits — the crate
# needs the real dependency, not just the generated adapter.
megu_core = { package = "megu-core", path = "../../core" }

[profile.release]
opt-level = 3
lto = true
