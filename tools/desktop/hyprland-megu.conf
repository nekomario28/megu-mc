# Optional Hyprland tweaks for the Megu client — copy or `source=` this
# file from ~/.config/hypr/hyprland.conf. Everything degrades cleanly on
# other compositors; nothing here is required for Megu to run.
#
# The client's Wayland app_id / X11 class is `megu-client`.

# Allow tearing for the game window (needs `general { allow_tearing = yes }`
# for `immediate` to take effect — a no-op otherwise).
windowrule = immediate, match:class ^(megu-client)$

# Fullscreen comfort: real fullscreen, no fake borderless resize events.
windowrule = fullscreenstate 2 2, match:class ^(megu-client)$

# Keep keyboard focus while dialogs (e.g. quit confirm) are open.
windowrule = stayfocused, match:class ^(megu-client)$

# Hyprland < 0.50 predates `match:` / renamed windowrulev2 — use instead:
# windowrulev2 = immediate, class:^(megu-client)$
# windowrulev2 = fullscreenstate 2 2, class:^(megu-client)$
# windowrulev2 = stayfocused, class:^(megu-client)$
