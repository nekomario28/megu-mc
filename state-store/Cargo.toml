[package]
name = "megu-state-store"
version = "0.1.0"
edition = "2021"
publish = false
license = "LGPL-3.0-or-later"
description = "Standalone 64-shard DimensionState/ServerContext runtime store and the declarative 1.21.1 <-> 26.3 DataFixer pipeline for megu"

# Zero external dependencies by contract: this crate is the clean-room runtime
# state core the server lanes converge on, so it must build on pure `std`.
# `megu-core` is the workspace-internal leaf crate (the canonical
# TargetVersion registry), not a crates.io dependency.
[dependencies]
megu_core = { package = "megu-core", path = "../core" }

[[bin]]
name = "megu-world-migrate"
path = "src/bin/world_migrate.rs"

# Standalone manifest: the root `[profile.release]` is not inherited, so the
# shipped binary opts into full optimisation, LTO and symbol stripping itself.
[profile.release]
opt-level = 3
lto = true
strip = true
