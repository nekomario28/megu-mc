name: Cross-platform checks

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on a branch or pull request is cancelled so a newer commit
# does not queue behind a stale ~27-minute three-OS matrix. `main` is never
# cancelled: a red gate on the default branch must not be hidden by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  xplat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Root `cargo test --bin megu` codegen-builds the full dependency tree on
    # every OS; 2-job Windows/macOS runners need well over the old 35-minute
    # check-only budget.
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      # Every standalone crate is its own manifest and lockfile, so without a
      # shared target directory each one recompiles the shared local crates
      # (megu-core, megu-proto, megu-state-store, ...) and the 29 external crates
      # that client-gpu already compiles. One shared target directory (the policy
      # ci.yml already uses on Linux) keeps every per-manifest invocation while
      # reusing compatible artifacts; cargo still hashes the feature set and
      # flags into each artifact, so no build is shared across incompatible
      # configurations.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Toolchain pinned (audit item 197); bump deliberately together with a green build.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
      # Downloaded sources only, never executable build products (see ci.yml for
      # why a cached target/ is unsafe next to the mutation gate). Keyed per OS
      # because the registry and git databases are not portable across runners.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: cargo-sources-${{ runner.os }}-
      # setup-java v4 is deprecated upstream (it still runs on the retired Node 20
      # runtime); v5 is the documented migration target and runs on Node 24.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      # The twelve standalone crates each carry their own Cargo.lock; build and
      # test the 11 CPU crates and compile-check isolated client-gpu on every OS
      # so a Unix-only assumption fails here, not on a contributor's Windows machine.
      - name: Standalone crate builds and tests
        shell: bash
        run: |
          for d in core proto state-store server-files mod-offload mod-adapter-core create-adapter client-kernel client-port client-ui client-app; do
            echo "=== $d ==="
            cargo test --manifest-path "$d/Cargo.toml" --locked
          done
          echo "=== client-gpu (check) ==="
          cargo check --manifest-path client-gpu/Cargo.toml --all-targets --locked
      # Root binary must compile and its unit tests must pass everywhere:
      # signal-hook is cfg(unix)-gated and entity UUID entropy goes through
      # os_fill_random (urandom / BCryptGenRandom). The crate is a single
      # binary (src/main.rs), so the target is --bin megu, not --lib.
      - name: Root binary tests (locked)
        run: cargo test --bin megu --locked -- --test-threads=2
      - name: Python & 3-OS installer/TUI gates
        shell: bash
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" tools/provenance_check.py --strict-zero-gl
          "$PY" tests/public_hygiene_test.py
          "$PY" tests/mini_jre_test.py
          "$PY" tests/megu_translate_test.py
          "$PY" tests/megu_tui_test.py
          "$PY" tests/installer_cross_os_test.py
          "$PY" tests/release_workflow_test.py
          "$PY" website/check_site.py
