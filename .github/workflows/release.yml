name: Release binaries and Docker validation

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0-alpha.1'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] \
              || [[ "$RELEASE_VERSION" == *..* ]]; then
            echo '::error::Version must be a safe v-prefixed semantic version'
            exit 1
          fi
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Release policy and reproducibility gates
        run: |
          python3 tools/provenance_check.py
          python3 tools/provenance_check.py --self-test
          bash tools/debt_ratchet.sh
          python3 tools/vanilla_parity_audit.py --format text --strict --min-c2s-handled 58 --min-gamerules-wired 51
          python3 tools/modloader_parity_audit.py --format text --strict --min-overall-pct 100
          python3 website/check_site.py
          python3 tests/release_bundle_test.py
          python3 tests/release_workflow_test.py
          python3 tests/xplat_packaging_test.py

  build-matrix:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            rust_target: ''
            kind: native
          - os: ubuntu-22.04
            target: linux-x86_64-musl
            rust_target: x86_64-unknown-linux-musl
            kind: musl
          - os: ubuntu-22.04-arm
            target: linux-arm64
            rust_target: ''
            kind: native
          - os: ubuntu-22.04-arm
            target: linux-arm64-musl
            rust_target: aarch64-unknown-linux-musl
            kind: musl
          # Dynamic-musl GPU client: built inside the pinned Alpine image
          # (packaging/docker/Dockerfile.alpine-client) so the binary can dlopen the
          # host's Vulkan/Wayland/X11 drivers. The static musl server lanes
          # above stay +crt-static for `FROM scratch` containers.
          - os: ubuntu-22.04
            target: linux-x86_64-musl-client
            rust_target: x86_64-unknown-linux-musl
            kind: musl-client
          - os: ubuntu-22.04-arm
            target: linux-arm64-musl-client
            rust_target: aarch64-unknown-linux-musl
            kind: musl-client
          # FreeBSD server: cross-compiled on Ubuntu with clang + ld.lld
          # against a checksum-pinned FreeBSD 14.4 base.txz sysroot — no
          # third-party VM action required. ring 0.17.14 builds its generic
          # C sources for this target.
          - os: ubuntu-22.04
            target: freebsd-x86_64
            rust_target: x86_64-unknown-freebsd
            kind: bsd
          # Linux RISC-V 64 server: cross-compiled with the Ubuntu
          # gcc-riscv64-linux-gnu toolchain (lp64d ABI via rv64gc).
          - os: ubuntu-22.04
            target: linux-riscv64
            rust_target: riscv64gc-unknown-linux-gnu
            kind: riscv
          - os: macos-latest
            target: macos-arm64
            rust_target: ''
            kind: native
          - os: macos-latest
            target: macos-x86_64
            rust_target: x86_64-apple-darwin
            kind: cross
          - os: windows-latest
            target: windows-x86_64
            rust_target: ''
            kind: native
          - os: windows-11-arm
            target: windows-arm64
            rust_target: ''
            kind: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
      - name: Install musl target toolchain
        if: matrix.kind == 'musl'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "${{ matrix.rust_target }}"
          # cc-rs (ring) looks for <arch>-linux-musl-gcc; musl-tools ships
          # musl-gcc, so expose the prefixed name it expects.
          arch="${RUST_TARGET%%-*}"
          sudo ln -sf "$(command -v musl-gcc)" "/usr/local/bin/${arch}-linux-musl-gcc"
          sudo ln -sf "$(command -v ar)" "/usr/local/bin/${arch}-linux-musl-ar"
      - name: Install cross-compilation Rust target
        if: matrix.kind == 'cross'
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Install FreeBSD sysroot toolchain
        if: matrix.kind == 'bsd'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          FREEBSD_RELEASE: "14.4-RELEASE"
          # SHA-256 of amd64/14.4-RELEASE/base.txz from the release MANIFEST.
          FREEBSD_BASE_SHA256: "769f60a6eea2938ad6b7943cfbcc17dfaf7d1f7ba59a32b869a00349302df853"
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils
          rustup target add "${{ matrix.rust_target }}"
          # FreeBSD base.txz carries libc/libthr/libm/libexecinfo, the C
          # runtime objects and all system headers: enough for ring's C
          # sources and the final clang+lld link. The tarball is verified
          # against the published SHA-256 before anything is read from it.
          url="https://download.freebsd.org/releases/amd64/${FREEBSD_RELEASE}/base.txz"
          curl -fsSLo "$RUNNER_TEMP/base.txz" "$url"
          echo "${FREEBSD_BASE_SHA256}  $RUNNER_TEMP/base.txz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/freebsd-sysroot"
          # Extract the whole archive: filtering members would turn FreeBSD's
          # .so symlinks into empty placeholders under GNU tar.
          tar -xJf "$RUNNER_TEMP/base.txz" -C "$RUNNER_TEMP/freebsd-sysroot"
      - name: Install RISC-V cross toolchain
        if: matrix.kind == 'riscv'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu
          rustup target add "${{ matrix.rust_target }}"
      - name: Build server and standalone release binaries (locked)
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          MATRIX_KIND: ${{ matrix.kind }}
          FREEBSD_SYSROOT: ${{ runner.temp }}/freebsd-sysroot
          # macOS 11 Big Sur is the oldest supported host OS: without an
          # explicit deployment target the SDK default (the runner's macOS
          # version) makes the binaries refuse to launch on older systems.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          if [[ "$MATRIX_KIND" == "bsd" ]]; then
            # FreeBSD sysroot cross-link: clang drives the link, ld.lld
            # resolves it, ring compiles its generic C with the same driver.
            export CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER=clang
            export CC_x86_64_unknown_freebsd=clang
            export CFLAGS_x86_64_unknown_freebsd="--target=x86_64-unknown-freebsd --sysroot=$FREEBSD_SYSROOT"
            export AR_x86_64_unknown_freebsd=ar
            export RANLIB_x86_64_unknown_freebsd=ranlib
            export RUSTFLAGS="-C link-arg=--target=x86_64-unknown-freebsd -C link-arg=--sysroot=$FREEBSD_SYSROOT -C link-arg=-fuse-ld=lld"
          elif [[ "$MATRIX_KIND" == "riscv" ]]; then
            # gcc-riscv64-linux-gnu ships its own sysroot; cc-rs (ring) and
            # rustc both route through the prefixed tools explicitly.
            export CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc
            export CC_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-gcc
            export AR_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-ar
            export RANLIB_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-ranlib
          fi
          if [[ "$MATRIX_KIND" == "musl-client" ]]; then
            : # built by the dedicated Alpine container step below
          elif [[ "$MATRIX_KIND" == musl || "$MATRIX_KIND" == bsd || "$MATRIX_KIND" == riscv ]]; then
            # Server-only lanes ship the same two-binary shape as the static
            # musl pair: `megu` plus `megu-installer`, no client suite.
            cargo build --locked --release --features mod-suite,create-offload --bin megu --target "$RUST_TARGET"
            cargo build --locked --release --manifest-path server-files/Cargo.toml --bin megu-installer --target "$RUST_TARGET"
          else
            # CARGO_BUILD_TARGET applies --target to every crate build below
            # without touching the per-crate command lines (empty for native
            # runners such as macos-latest arm64 and windows-11-arm).
            if [[ -n "$RUST_TARGET" ]]; then export CARGO_BUILD_TARGET="$RUST_TARGET"; fi
            # Full desktop lanes ship exactly the three end-user binaries:
            # server, GPU client and installer. The internal tools
            # (megu-client, megu-mod-check, megu-world-migrate, megu-init,
            # megu-admin) stay source-buildable but leave the release.
            cargo build --locked --release --features mod-suite,create-offload --bin megu
            cargo build --locked --release --manifest-path client-gpu/Cargo.toml --bin megu-client-gpu
            cargo build --locked --release --manifest-path server-files/Cargo.toml --bin megu-installer
          fi
      - name: Build dynamic musl GPU client (Alpine container)
        if: matrix.kind == 'musl-client'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          image="megu-musl-client:$RUST_TARGET"
          docker build --target export \
            --build-arg RUST_TARGET="$RUST_TARGET" \
            -f packaging/docker/Dockerfile.alpine-client \
            -t "$image" .
          cid="$(docker create "$image" /megu-client-gpu)"
          mkdir -p dist-bin
          docker cp "$cid:/megu-client-gpu" dist-bin/megu-client-gpu
          docker rm "$cid"
          # The Dockerfile already asserts it; re-check here so a statically
          # linked artifact can never reach the release tarball.
          readelf -l dist-bin/megu-client-gpu | grep -q 'ld-musl'
      - name: Smoke test megu-client-gpu headless probe
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          probe="client-gpu/target/release/megu-client-gpu$suffix"
          if [[ -n "$RUST_TARGET" ]]; then
            probe="client-gpu/target/$RUST_TARGET/release/megu-client-gpu$suffix"
          fi
          if [[ -f "$probe" ]]; then
            # A cross-compiled probe (x86_64 macOS on an ARM64 runner) cannot
            # execute natively; skip it there instead of failing the job.
            run_probe=1
            if [[ "$RUST_TARGET" == x86_64-* && "$RUNNER_ARCH" != "X64" ]]; then run_probe=0; fi
            if [[ "$RUST_TARGET" == aarch64-* && "$RUNNER_ARCH" != "ARM64" ]]; then run_probe=0; fi
            if [[ "$run_probe" == 1 ]]; then "$probe" --headless-probe; fi
          fi
      - name: Package and verify release archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust_target }}
          MATRIX_KIND: ${{ matrix.kind }}
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          out_dir="dist/$RELEASE_TARGET"
          if [[ "$MATRIX_KIND" == "musl-client" ]]; then
            # The dynamic-musl bundle ships the GPU client alone; server
            # binaries live in the separate static `*-musl` archives so a
            # `FROM scratch` image never picks up a dynamically linked one.
            "$PY" tools/release_bundle.py build \
              --binary "dist-bin/megu-client-gpu$suffix" \
              --out-dir "$out_dir" --version "$RELEASE_VERSION" --target "$RELEASE_TARGET"
          elif [[ "$MATRIX_KIND" == musl || "$MATRIX_KIND" == bsd || "$MATRIX_KIND" == riscv ]]; then
            "$PY" tools/release_bundle.py build \
              --binary "target/$RUST_TARGET/release/megu$suffix" \
              --extra-binary "server-files/target/$RUST_TARGET/release/megu-installer$suffix" \
              --out-dir "$out_dir" --version "$RELEASE_VERSION" --target "$RELEASE_TARGET"
          else
            # Cross builds (--target via CARGO_BUILD_TARGET) land under
            # target/<triple>/release; native builds use target/release.
            rel_dir='release'
            if [[ -n "$RUST_TARGET" ]]; then rel_dir="$RUST_TARGET/release"; fi
            "$PY" tools/release_bundle.py build \
              --binary "target/$rel_dir/megu$suffix" \
              --extra-binary "client-gpu/target/$rel_dir/megu-client-gpu$suffix" \
              --extra-binary "server-files/target/$rel_dir/megu-installer$suffix" \
              --out-dir "$out_dir" --version "$RELEASE_VERSION" --target "$RELEASE_TARGET"
          fi
          "$PY" tools/release_bundle.py verify \
            --bundle "$out_dir/megu-$RELEASE_VERSION-$RELEASE_TARGET.tar.gz" \
            --manifest "$out_dir/release-manifest.json" \
            --sums "$out_dir/SHA256SUMS"
      - name: Upload verified platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  docker-check:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build release Docker image
        run: docker build -f docker/Dockerfile .

  publish-release:
    needs: [preflight, build-matrix, docker-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
      - name: Build launcher bootstrapper JAR, Prism bundle, integrated mod, and CycloneDX SBOM
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p dist/launcher-stage dist/launcher-bundles dist/publish
          python3 tools/client_launcher/gen_launcher_profile.py \
            --out-dir dist/launcher-stage --mc-version 1.21.1 --build-jar
          test -f dist/launcher-stage/megu-bootstrapper.jar
          cp dist/launcher-stage/megu-bootstrapper.jar dist/publish/megu-bootstrapper.jar
          python3 tools/client_launcher/export_launcher_bundle.py \
            --out-dir dist/launcher-bundles/prism --format prism --mc-version 1.21.1 \
            --bootstrap-jar dist/publish/megu-bootstrapper.jar --prism-zip
          cp dist/launcher-bundles/prism/megu-prism-1.21.1.zip dist/publish/megu-prism-1.21.1.zip
          python3 tools/client_launcher/build_integrated_mod.py \
            --out-dir dist/launcher-bundles/integrated
          test -f dist/launcher-bundles/integrated/megu-integrated.jar
          cp dist/launcher-bundles/integrated/megu-integrated.jar dist/publish/megu-integrated.jar
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          components = {}
          pkg_re = re.compile(r'(?ms)^\[\[package\]\]\s*\n(.*?)(?=^\[\[package\]\]|\Z)')
          name_re = re.compile(r'(?m)^name\s*=\s*"([^"]+)"')
          ver_re = re.compile(r'(?m)^version\s*=\s*"([^"]+)"')
          for lock in sorted(Path('.').glob('**/Cargo.lock')):
              if 'target' in lock.parts or '.git' in lock.parts:
                  continue
              text = lock.read_text(encoding='utf-8')
              for block in pkg_re.findall(text):
                  nm = name_re.search(block)
                  vm = ver_re.search(block)
                  if nm and vm:
                      key = (nm.group(1), vm.group(1))
                      components[key] = {
                          'type': 'library',
                          'name': key[0],
                          'version': key[1],
                          'purl': f'pkg:cargo/{key[0]}@{key[1]}',
                      }
          sbom = {
              'bomFormat': 'CycloneDX',
              'specVersion': '1.5',
              'version': 1,
              'metadata': {
                  'component': {
                      'type': 'application',
                      'name': 'megu',
                      'version': os.environ['RELEASE_VERSION'],
                      'licenses': [{'license': {'id': 'LGPL-3.0-or-later'}}],
                  }
              },
              'components': [components[k] for k in sorted(components)],
          }
          out = Path('dist/publish') / f'megu-{os.environ["RELEASE_VERSION"]}-sbom.cdx.json'
          out.write_text(json.dumps(sbom, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify archives and generate combined checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          targets = ('linux-x86_64', 'linux-x86_64-musl', 'linux-arm64',
                     'linux-arm64-musl', 'linux-x86_64-musl-client',
                     'linux-arm64-musl-client', 'freebsd-x86_64',
                     'linux-riscv64', 'macos-arm64', 'macos-x86_64',
                     'windows-x86_64', 'windows-arm64')
          # Full desktop lanes ship exactly the three end-user binaries;
          # the internal tools stay source-buildable, unshipped.
          desktop_binaries = ('megu', 'megu-client-gpu', 'megu-installer')
          # Server-only lanes (static musl, FreeBSD, RISC-V) ship the same
          # pair; the dynamic-musl lanes ship the GPU client alone.
          server_binaries = ('megu', 'megu-installer')
          client_binaries = ('megu-client-gpu',)
          server_targets = {'freebsd-x86_64', 'linux-riscv64'}
          output = Path('dist/publish')
          output.mkdir(parents=True, exist_ok=True)
          checksums = {}
          manifests = {}
          for target in targets:
              folder = Path('dist') / f'release-{target}'
              archive = folder / f'megu-{os.environ["RELEASE_VERSION"]}-{target}.tar.gz'
              manifest = folder / 'release-manifest.json'
              sums = folder / 'SHA256SUMS'
              subprocess.run([sys.executable, 'tools/release_bundle.py', 'verify',
                              '--bundle', str(archive), '--manifest', str(manifest),
                              '--sums', str(sums)], check=True)
              metadata = json.loads(manifest.read_text(encoding='utf-8'))
              if (metadata['version'] != os.environ['RELEASE_VERSION']
                      or metadata['target_triple'] != target
                      or metadata['git_sha'] != os.environ['GITHUB_SHA']):
                  raise SystemExit(f'manifest identity mismatch for {target}')
              suffix = '.exe' if target.startswith('windows-') else ''
              members = {entry['path'].rsplit('/', 1)[-1]
                         for entry in metadata['files']}
              if target.endswith('-musl-client'):
                  expected = client_binaries
              elif target.endswith('-musl') or target in server_targets:
                  expected = server_binaries
              else:
                  expected = desktop_binaries
              missing = {name + suffix for name in expected} - members
              if missing:
                  raise SystemExit(f'{target} missing release binaries: {sorted(missing)}')
              manifests[target] = metadata
              shutil.copyfile(archive, output / archive.name)
              import tarfile
              with tarfile.open(archive, 'r:gz') as tf:
                  inst_member = f'megu-{os.environ["RELEASE_VERSION"]}-{target}/megu-installer{suffix}'
                  # GPU-client-only archives carry no installer to extract.
                  if inst_member in tf.getnames():
                      inst_out = output / f'megu-installer-{target}{suffix}'
                      inst_out.write_bytes(tf.extractfile(inst_member).read())
                      inst_out.chmod(0o755)
          # One aggregated manifest replaces the twelve per-target
          # release-manifest-<target>.json files on the Release page; every
          # archive above was already verified against its own manifest.
          combined = {
              'format': 1,
              'product': 'megu',
              'version': os.environ['RELEASE_VERSION'],
              'git_sha': os.environ['GITHUB_SHA'],
              'license': 'LGPL-3.0-or-later',
              'subcrate_license': 'LGPL-3.0-or-later',
              'targets': {target: manifests[target] for target in targets},
          }
          combined_name = f'megu-{os.environ["RELEASE_VERSION"]}-release-manifest.json'
          (output / combined_name).write_text(
              json.dumps(combined, indent=2, sort_keys=True) + '\n',
              encoding='utf-8')
          for artifact in sorted(output.iterdir()):
              if artifact.is_file() and artifact.name != 'SHA256SUMS-all.txt':
                  checksums[artifact.name] = hashlib.sha256(artifact.read_bytes()).hexdigest()
          (output / 'SHA256SUMS-all.txt').write_text(
              ''.join(f'{checksums[name]}  {name}\n' for name in sorted(checksums)),
              encoding='utf-8')
          PY
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Quick Start

          Most desktop users need only the standalone installer for their platform:

          | Platform | Start with |
          |---|---|
          | Linux x86_64 | `megu-installer-linux-x86_64` |
          | Linux arm64 | `megu-installer-linux-arm64` |
          | macOS arm64 | `megu-installer-macos-arm64` |
          | macOS x86_64 | `megu-installer-macos-x86_64` |
          | Windows x86_64 | `megu-installer-windows-x86_64.exe` |
          | Windows arm64 | `megu-installer-windows-arm64.exe` |

          Run the installer, then choose the **Megu (1.21.1)** profile in your launcher. First-time integrated-singleplayer setup is explicit: the installer asks for EULA/runtime-data consent, downloads or uses the pinned official 1.21.1 server jar plus pinned MIT minecraft-data block metadata, and generates the runtime data locally. It fails closed rather than creating a partial singleplayer install.

          The platform tarballs are for manual/advanced installs. Full desktop archives contain `megu`, `megu-client-gpu`, and `megu-installer`. `*-musl`, `freebsd-*` and `*-riscv64` archives are **server-only** (`megu` + `megu-installer`; the musl ones are statically linked). `*-musl-client` archives carry only the dynamically linked musl `megu-client-gpu` (Vulkan/Wayland/X11).

          ## Beta scope

          - The live game listener is **Minecraft 1.21.1 / protocol 767**. 26.3 is a tooling and migration target in this beta, not an accepted game-listener protocol.
          - The release is clean-room: artifacts ship no Mojang jar, datapack, captured protocol stream, or generated `*_1211*` runtime data. Operators generate those inputs locally after explicit consent.
          - Verified server scope includes 51/51 GameRules, 42/42 Enchantments, 39/39 Effects, Vanilla fuels/death messages, persistent saves/backups, RCON/console administration, and the native `wgpu` client described in the operator guide.

          ## Verification evidence

          Same-tree pre-release evidence for this candidate: fast gates **59/59 PASS**, strict Vanilla parity audit **11/11 PASS**, mechanics coverage audit PASS, release bundle/workflow/packaging tests PASS, live SIGTERM persistence smoke PASS inside the 900 ms shutdown budget, and the clean public-export provenance rehearsal PASS.

          ## Known beta limits

          - Strict live S2C Play emission coverage is **107/124 (86.3%)**; whole-world M2 parity remains open.
          - NeoForge configuration negotiation is not yet wired into the live listener. Arbitrary Java Mixin execution and Wave 3 real third-party modpack E2E remain unverified.
          - Comparator and beehive parity lanes are deliberately deferred past beta.1.
          - `megu-core::nbt_sidecar`, `megu-core::vanilla_physics`, `proto::entity_metadata`, and `state-store::saved_data` are public foundations that are not wired into the live listener yet.
          EOF
          options=(--title "$RELEASE_VERSION" --generate-notes --notes-file release-notes.md)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            options+=(--verify-tag)
          else
            options+=(--target "$GITHUB_SHA")
            if [[ "$RELEASE_DRAFT" == true ]]; then options+=(--draft); fi
          fi
          if [[ "$RELEASE_VERSION" == *-alpha* || "$RELEASE_VERSION" == *-beta* || "$RELEASE_VERSION" == *-rc* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" dist/publish/* "${options[@]}"
