name: P1 native oracle verification

# The ordinary ci.yml only runs for PRs targeting main and selected pushes.
# Stacked P1-1 drafts need their own explicit gate until they are merged.
on:
  push:
    branches:
      - 'test/native-*'
      - 'feat/p1-falling-*'
  workflow_dispatch:

# CI runs compiler/tests only. Explicitly select the already-installed pinned
# compiler so rustup does not auto-sync optional rustfmt/clippy from
# rust-toolchain.toml when Cargo first starts (runner component-file conflict).
env:
  RUSTUP_TOOLCHAIN: '1.98.0'

permissions:
  contents: read

jobs:
  portable:
    name: Native fixture guards (no game JAR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Inventory, coverage and fail-closed parser checks
        run: |
          python3 tests/native_survival_inventory_test.py
          python3 tests/native_survival_oracle_test.py
          python3 tests/native_neighbor_trace_test.py
          python3 tests/template_neighbor_oracle_test.py
      - name: Enforce ignored-test debt ratchet before expensive suites
        run: bash tools/debt_ratchet.sh
      - name: Native-Cargo pairing gate negative controls
        run: python3 tests/native_cargo_gate_test.py
      - name: Enumerate all pinned states
        run: |
          python3 tools/native_support_inventory.py --scope all --output "${RUNNER_TEMP}/megu-states.tsv"
          test "$(wc -l < "${RUNNER_TEMP}/megu-states.tsv")" -eq 26684

  native:
    name: Pinned 1.21.1 Java oracle (all 26684 states)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Retrieve the official pinned server JAR, verify BEFORE use
        env:
          PINNED_SHA1: 59353fb40c36d304f2035d51e7d6e6baa98dc05c
        run: |
          curl --fail --location --retry 3 --silent --show-error             "https://piston-data.mojang.com/v1/objects/${PINNED_SHA1}/server.jar"             --output "${RUNNER_TEMP}/server.jar"
          printf '%s  %s\n' "${PINNED_SHA1}" "${RUNNER_TEMP}/server.jar" | sha1sum --check -
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: 1.98.0
      - name: Compile and execute all 320208 native canSurvive observations
        run: |
          python3 tools/native_survival_oracle.py             --scope all --timeout 900             --jar "${RUNNER_TEMP}/server.jar"             --output "${RUNNER_TEMP}/native-survival.tsv"
      - name: Execute real native request and LevelTicks delivery probes
        run: |
          python3 tools/native_neighbor_trace.py             --jar "${RUNNER_TEMP}/server.jar"             --output "${RUNNER_TEMP}/native-requests.tsv"

      - name: Compare native LevelTicks callbacks with Rust queue (mandatory)
        env:
          MC_NATIVE_TICK_REQUESTS: ${{ runner.temp }}/native-requests.tsv
          MC_NATIVE_TICK_DELIVERIES: ${{ runner.temp }}/native-requests.delivered.tsv
        run: |
          test -s "$MC_NATIVE_TICK_REQUESTS"
          test -s "$MC_NATIVE_TICK_DELIVERIES"
          python3 tools/native_cargo_gate.py native_level_ticks_port_delivery_pair
      - name: Capture all 25 native updateShape cases
        run: |
          python3 tools/template_neighbor_oracle.py \
            --jar "${RUNNER_TEMP}/server.jar" \
            --output "${RUNNER_TEMP}/native-neighbor-shapes.tsv"
      - name: Paired native/Rust neighbor shape states (mandatory)
        env:
          MC_NATIVE_NEIGHBOR_SHAPES: ${{ runner.temp }}/native-neighbor-shapes.tsv
        run: |
          test -s "$MC_NATIVE_NEIGHBOR_SHAPES"
          python3 tools/native_cargo_gate.py native_neighbor_shape_port_pair
      - name: Paired native/Rust fragile support matrix (mandatory)
        env:
          MC_NATIVE_SURVIVAL_MATRIX: ${{ runner.temp }}/native-survival.tsv
        run: |
          test -s "$MC_NATIVE_SURVIVAL_MATRIX"
          python3 tools/native_cargo_gate.py native_survival_fragile_port_pair

  rust:
    name: Rust P1-1 compile and serialized tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: 1.98.0
      - name: Compile and run serialized regressions on this exact PR head
        run: cargo test --locked -- --test-threads=1


  full:
    name: P1 full verification (serial, parallel, wire, adapters, mutation)
    runs-on: ubuntu-latest
    # Measured: the previous 60-minute bound cancelled this job while it was still
    # in the wire stage (and the same body takes ~45 min on a local 2-core scope),
    # so the mutation stage never ran and the red was capacity, not a failure.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: 1.98.0
      - name: Install pinned gxkit dependency inspector
        env:
          GXKIT_REV: d6b9ad8db4774919c8b4fb032342e53b2548b660
        run: |
          git init "$RUNNER_TEMP/gxkit"
          git -C "$RUNNER_TEMP/gxkit" remote add origin https://github.com/nekomario28/gxkit.git
          git -C "$RUNNER_TEMP/gxkit" fetch --depth=1 origin "$GXKIT_REV"
          git -C "$RUNNER_TEMP/gxkit" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/gxkit" rev-parse HEAD)" = "$GXKIT_REV"
          python3 -m venv "$RUNNER_TEMP/gxkit-venv"
          "$RUNNER_TEMP/gxkit-venv/bin/python" -m pip install \
            "$RUNNER_TEMP/gxkit/packages/gxcore" \
            "$RUNNER_TEMP/gxkit/packages/depsgx"
          echo "$RUNNER_TEMP/gxkit-venv/bin" >> "$GITHUB_PATH"
      - name: Fetch locked crates before offline verification
        run: cargo fetch --locked
      - name: Run full repository pre-merge verification
        run: bash tests/verify.sh
