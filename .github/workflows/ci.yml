name: Rust regression checks

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (locked)
        run: cargo build --locked
      - name: Unit and regression tests (locked, serialized)
        run: cargo test --locked -- --test-threads=1
      - name: Bounded localhost network smoke
        run: python3 tests/wire_smoke.py target/debug/mc-spine
      - name: Check Java adapter feature compilation
        run: |
          cargo check --locked --features fabric-probe
          cargo check --locked --features neoforge-events

  # Separate from the suite on purpose: a green suite is not evidence that a gate works. This job
  # breaks each pinned implementation and requires the named test to go red, so a test that can no
  # longer fail is a red build rather than a green one that checks nothing.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Every pinned gate must fail when its implementation is broken
        run: bash tools/mutation_check.sh
      # The check rewrites a source file to break it and puts it back. If it fails to put it back,
      # the tree stays mutated and every later measurement is of a source nobody chose - the check
      # itself then reports failures that are about the mutation, not the code. That happened here
      # and cost an afternoon, so the invariant is asserted rather than trusted.
      - name: The check must leave the tree exactly as it found it
        run: |
          if ! git diff --exit-code -- src >/dev/null; then
            echo "::error::tools/mutation_check.sh left the source modified"
            git diff -- src
            exit 1
          fi
