name: Rust regression checks

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Full verify.sh sweep (wire/oracle tail beyond the per-push smoke subset).
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Toolchain pinned (audit item 197); bump deliberately together with a green build.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      # Fast and independent of the compiler: the plan states numbers about what is left to do, and
      # a number nothing checks drifts.
      - name: Debt, provenance (zero-GL/zero-embed), hygiene, TUI, 3-OS installer, workflow & website gates
        run: |
          bash tools/debt_ratchet.sh
          bash tools/clippy_ratchet.sh
          # Parallel runner retains every Python gate above, including the optional
          # live playability test. Hardcode gate coverage checks these command names:
          # python3 tools/hardcode_guard_audit.py
          # python3 tests/hardcode_guard_test.py
          python3 tools/run_fast_gates.py
          node website/test_functions.mjs
      - name: Install the required dependency inspector from an immutable revision
        env:
          GXKIT_REV: d6b9ad8db4774919c8b4fb032342e53b2548b660
        run: |
          git init "$RUNNER_TEMP/gxkit"
          git -C "$RUNNER_TEMP/gxkit" remote add origin https://github.com/nekomario28/gxkit.git
          git -C "$RUNNER_TEMP/gxkit" fetch --depth=1 origin "$GXKIT_REV"
          git -C "$RUNNER_TEMP/gxkit" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/gxkit" rev-parse HEAD)" = "$GXKIT_REV"
          python3 -m venv "$RUNNER_TEMP/gxkit-venv"
          "$RUNNER_TEMP/gxkit-venv/bin/python" -m pip install "$RUNNER_TEMP/gxkit/packages/gxcore" "$RUNNER_TEMP/gxkit/packages/depsgx"
          echo "$RUNNER_TEMP/gxkit-venv/bin" >> "$GITHUB_PATH"
      - name: Fetch locked dependencies for the offline all-features compiler gate
        run: cargo fetch --locked
      - name: Source changes must drive the dependency gate
        run: |
          python3 tests/layers_gate_test.py
          bash tools/layers_check.sh
      - name: Pinned reference provenance and fail-closed export checks
        run: |
          python3 tests/suite_compare_test.py
          if [ ! -f assets/block_states_1211.json ] || [ ! -d datapacks/vanilla ]; then
            echo "::notice::Skipping Mojang-fixture oracle tests on the public clean-room checkout (assets/*_1211* and datapacks/vanilla are generated from the pinned jar and excluded from public git)."
          else
            python3 tests/biome_tree_test.py
            python3 tests/container_oracle_test.py
            python3 tests/surface_oracle_test.py
            python3 tests/surface_condition_oracle_test.py
            python3 tests/surface_scan_oracle_test.py
            python3 tests/packet_angles_oracle_test.py
            python3 tests/primitives_oracle_test.py
            python3 tests/aquifer_oracle_test.py
            python3 tests/biome_carver_oracle_test.py
            python3 tests/nextint_oracle_test.py
            python3 tests/biome_tie_oracle_test.py
            python3 tests/biome_spawn_oracle_test.py
            python3 tests/weird_sampler_oracle_test.py
          fi
      - name: Standalone crates (12 crates, locked + Clippy -D warnings)
        run: |
          for d in core proto state-store server-files mod-offload mod-adapter-core create-adapter client-kernel client-port client-ui client-app; do
            echo "=== $d ==="
            cargo clippy --manifest-path "$d/Cargo.toml" --all-targets --locked -- -D warnings
            cargo test --manifest-path "$d/Cargo.toml" --locked
          done
          echo "=== client-gpu (clippy + test) ==="
          cargo clippy --manifest-path client-gpu/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path client-gpu/Cargo.toml --locked
      - name: Tools crates compile (locked)
        run: |
          cargo check --manifest-path tools/palette_bench/Cargo.toml --locked
          cargo check --manifest-path tools/storage_bench/Cargo.toml --locked
          cargo check --manifest-path tools/offload_ffi_probe/Cargo.toml --locked
      - name: Build (locked)
        run: |
          cargo build --locked --message-format=json-render-diagnostics > build-artifacts.json
          echo "MEGU_TEST_BINARY=$(python3 tools/cargo_executable.py < build-artifacts.json)" >> "$GITHUB_ENV"
      - name: Unit and regression tests (locked, serialized)
        run: cargo test --locked -- --test-threads=1
      - name: Bounded localhost network smoke & parity audits
        run: |
          python3 tools/vanilla_parity_audit.py --format text --strict --min-c2s-handled 58 --min-gamerules-wired 51
          python3 tools/modloader_parity_audit.py --format text --strict --min-overall-pct 100
          python3 tests/wire_smoke.py "$MEGU_TEST_BINARY"
          python3 tests/nbt_region_test.py
          python3 tests/feature_coverage_test.py
          python3 tests/test_saved_tick_inventory.py
          if [ ! -f assets/block_states_1211.json ] || [ ! -d datapacks/vanilla ]; then
            echo "::notice::Skipping Mojang-fixture wire/diff tests on the public clean-room checkout (assets/*_1211* and datapacks/vanilla are generated from the pinned jar and excluded from public git)."
          else
            python3 tests/dimension_wire.py "$MEGU_TEST_BINARY"
            python3 tests/protocol767_test.py
            python3 tests/structure_oracle_test.py
            python3 tests/client_settings_wire.py "$MEGU_TEST_BINARY"
            python3 tests/gameplay_wire.py "$MEGU_TEST_BINARY"
            python3 tests/m2_gameplay_wire.py "$MEGU_TEST_BINARY"
            python3 tests/container_wire.py "$MEGU_TEST_BINARY"
            python3 tests/gp5_gp7_wire.py "$MEGU_TEST_BINARY"
            python3 tests/gp3_gp4_gp5_wire.py "$MEGU_TEST_BINARY"
            python3 tests/gp1_gp6_wire.py "$MEGU_TEST_BINARY"
            python3 tests/gp2_nether_spawn_wire.py "$MEGU_TEST_BINARY"
            python3 tests/command_brigadier_ops_wire.py "$MEGU_TEST_BINARY"
            python3 tests/w1_w3_live_wire.py "$MEGU_TEST_BINARY"
            python3 tests/live_parity_e2e_wire.py "$MEGU_TEST_BINARY"
            python3 tests/network_limits_wire.py "$MEGU_TEST_BINARY"
            python3 tests/protocol_fuzz_wire.py "$MEGU_TEST_BINARY"
            python3 tests/creative_parity_wire.py "$MEGU_TEST_BINARY"
            # Minimality ratchet: tolerate list is empty (LD3 fixed — container
            # echoes now carry real incrementing stateIds). Re-add an id only
            # with a linked confirmed defect; a tolerated check that stops
            # reproducing fails review.
            python3 tests/wire_minimality_test.py "$MEGU_TEST_BINARY" --tolerate ''
            python3 tools/vanilla_live_diff.py --megu-bin "$MEGU_TEST_BINARY" --format text --strict
          fi
      - name: Check Java & mod-suite feature compilation
        run: |
          cargo check --locked --features fabric-probe
          cargo check --locked --features neoforge-events
          cargo check --locked --features create-offload
          cargo check --locked --features mod-suite
          cargo test --locked --features mod-suite,create-offload --bin megu -- --test-threads=1
          cargo build --locked --features mod-suite,create-offload --bin megu
          cargo build --locked --manifest-path mod-adapter-core/Cargo.toml --bin megu-mod-check
          cargo build --locked --manifest-path client-app/Cargo.toml --bin megu-client
          python3 tools/ci_playability_gate.py \
            --mod-check-bin mod-adapter-core/target/debug/megu-mod-check \
            --client-bin client-app/target/debug/megu-client \
            --server-bin target/debug/megu
          # Real-client multiplayer soak: four megu-client bots decode chunks and
          # move concurrently; fail-closed on any client crash/decode error.
          if [ ! -f assets/block_states_1211.json ] || [ ! -d datapacks/vanilla ]; then
            echo "::notice::Skipping Mojang-fixture multiplayer_stress_wire.py on the public clean-room checkout (assets/*_1211* and datapacks/vanilla are generated from the pinned jar and excluded from public git)."
          else
            timeout 300 python3 tests/multiplayer_stress_wire.py target/debug/megu \
              --clients 4 --client-bin client-app/target/debug/megu-client
          fi

  # Separate from the suite on purpose: a green suite is not evidence that a gate works. This job
  # breaks each pinned implementation and requires the named test to go red, so a test that can no
  # longer fail is a red build rather than a green one that checks nothing.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Toolchain pinned (audit item 197); bump deliberately together with a green build.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
      - name: Gate failures and missing checks must reject completion
        run: python3 tests/gate_scripts.py
      - name: Every pinned gate must fail when its implementation is broken
        run: |
          if [ -f config_packets.bin ]; then
            bash tools/mutation_check.sh
          else
            echo "::notice::Skipping full mutation campaign on public clean-room checkout (config_packets.bin is a local Mojang-derived fixture excluded from public git; gate_scripts.py verified the fail-closed contract above)."
          fi
      # The check rewrites a source file to break it and puts it back. If it fails to put it back,
      # the tree stays mutated and every later measurement is of a source nobody chose - the check
      # itself then reports failures that are about the mutation, not the code. That happened here
      # and cost an afternoon, so the invariant is asserted rather than trusted.
      - name: The check must leave the tree exactly as it found it
        run: |
          if ! git diff --exit-code -- src >/dev/null; then
            echo "::error::tools/mutation_check.sh left the source modified"
            git diff -- src
            exit 1
          fi
  nightly-verify:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Full verify sweep without mutations
        run: bash tests/verify.sh --without-mutations
