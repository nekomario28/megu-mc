name: Deploy website to GitHub Pages

# Manual-only release valve. This workflow never runs on push, merge, or a
# schedule: a maintainer starts a deploy from the Actions tab, and only after
# the site check and the provenance gate pass.
#
# Custom domain: pass a bare hostname such as `megu.megumin.tech` in the
# `cname` input and the deploy writes it to `website/CNAME` (the DNS record and
# the repo's Pages custom-domain setting are still configured by hand). Leave
# the input empty to serve from the default <owner>.github.io/<repo> URL.
on:
  workflow_dispatch:
    inputs:
      cname:
        description: 'Custom domain written to CNAME (e.g. megu.megumin.tech); empty = github.io'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: a second manual run queues instead of cancelling the
# deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate the static site and its provenance
        run: |
          test -d website || { echo '::error::website/ is missing; nothing to deploy'; exit 1; }
          if [ -f website/check_site.py ]; then
            python3 website/check_site.py
          else
            echo '::notice::website/check_site.py not present yet; skipping site check'
          fi
          python3 tools/provenance_check.py
      - name: Write CNAME for the optional custom domain
        if: ${{ inputs.cname != '' }}
        env:
          CNAME_VALUE: ${{ inputs.cname }}
        run: |
          # Only a bare hostname is ever written, so the input cannot smuggle a
          # URL, path, or extra lines into the deployed artifact.
          printf '%s\n' "$CNAME_VALUE" \
            | grep -Eq '^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$' \
            || { echo "::error::not a clean hostname: $CNAME_VALUE"; exit 1; }
          printf '%s\n' "$CNAME_VALUE" > website/CNAME
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
