name: Bug report
description: Report a crash, misbehavior, or compatibility bug in Megu (megu). Crash reports need a MEGU-E fingerprint. クラッシュ報告には MEGU-E フィンガープリントが必要です。
title: "[Bug] "
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it compact — one issue per bug. Crash reports are easiest to
        triage with a `MEGU-E-XXXXXXXX` fingerprint from the crash screen.
        Feature requests and support questions belong in [GitHub Discussions](https://github.com/nekomario28/megu-mc/discussions).

        簡潔にお願いします — 1 issue = 1 bug。クラッシュ報告はクラッシュ画面の
        `MEGU-E-XXXXXXXX` フィンガープリント付きが最もトリアージしやすいです。
        機能要望・サポート質問は GitHub Discussions へ。

  - type: input
    id: fingerprint
    attributes:
      label: Crash fingerprint
      description: "From the crash report header, e.g. `MEGU-E-1A2B3C4D`. Leave blank for non-crash bugs. (クラッシュレポート先頭の識別子)"
      placeholder: "MEGU-E-XXXXXXXX"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "Subsystem most closely related to this bug. (最も関連する領域)"
      options:
        - "area:vanilla — Gameplay / protocol / worldgen / save"
        - "area:mod — NeoForge / Fabric data-driven or offload adapter"
        - "area:jni — JVM / JNI bridge / Mixin boundary"
        - "area:client — Native client / wgpu / shaders / UI"
        - "area:web — Website / /api/report / docs"
        - "Other / unsure"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Impact / priority
      description: "Helps triage release blockers first. (影響度)"
      options:
        - "P0-blocker — Crash, world corruption, or cannot start/join"
        - "P1-parity — Vanilla or mod behavior mismatch"
        - "P2-perf — High CPU/RAM/GPU usage or frame/tick stutter"
        - "Normal / cosmetic"
    validations:
      required: true

  - type: dropdown
    id: mc_version
    attributes:
      label: Minecraft version
      options:
        - "1.21.1 (LTS)"
        - "26.3 (Latest)"
        - Other / multiple
    validations:
      required: true

  - type: input
    id: engine_version
    attributes:
      label: Megu / engine version
      description: "Commit SHA, release tag, or build identifier. (コミット SHA・リリースタグ等)"
      placeholder: "e.g. v0.1.0-alpha.2 or git sha"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: "OS and CPU. (OS と CPU)"
      options:
        - "Linux x86_64"
        - "Linux arm64 (aarch64)"
        - "Windows 11 x86_64"
        - "macOS (Apple Silicon / Intel)"
        - Other / multiple
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      description: "Optional — e.g. Ryzen 7 7800X3D, Apple M3, Snapdragon X Elite."
      placeholder: "Optional"
    validations:
      required: false

  - type: dropdown
    id: display_server
    attributes:
      label: Display server / session
      description: "Linux only — leave blank on Windows/macOS. (Linux のみ。Windows/macOS では空欄)"
      options:
        - "Wayland"
        - "X11 / XWayland"
        - "Not applicable (headless / Windows / macOS)"
    validations:
      required: false

  - type: input
    id: gpu
    attributes:
      label: GPU / renderer
      description: "Optional — e.g. Vulkan on RTX 4060, ClassicLowSpec on Intel UHD 630. (GPU とレンダラ)"
      placeholder: "Optional"
    validations:
      required: false

  - type: input
    id: mods
    attributes:
      label: Mod count / key mods
      description: "Optional — e.g. `14 mods, Create + Sodium`. (導入 mod 数・主要 mod)"
      placeholder: "Optional"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "1–2 lines: what happened and what you expected. (何が起きたか・期待動作)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Minimal repro — commands, world state, or modpack name. (最小再現手順)"
      placeholder: |
        1. Start server with ...
        2. Join and run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: crash_log
    attributes:
      label: Crash report / log snippet
      description: |
        Paste the relevant lines only (crash header, ERROR/WARN lines,
        top stack frames — max ~20 lines). Redact home paths, IPs, and
        tokens first. `MEGU-E-XXXXXXXX` fingerprint を必ず含めてください。
      render: shell
    validations:
      required: false
