# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#   cargo deny check advisories licenses bans sources
# The license allowlist below was derived from `cargo metadata --all-features` for the
# committed Cargo.lock; it lists licenses that actually occur, nothing speculative.
# (78 crates, last checked 2026-10-26 with cargo-deny 0.20.2.)
# It describes what the dependency tree contains and is NOT a legal opinion (see THIRD_PARTY.md).

[graph]
# Check the whole tree, including the optional JNI adapters (java-compat etc.).
all-features = true

[advisories]
version = 2
# Yanked crates fail the check; unmaintained/unsound advisories also fail (default scope: workspace).
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA bundle)
]
confidence-threshold = 0.93

# The root crate mc-spine declares `license = "Apache-2.0"` in Cargo.toml (matches LICENSE), so it
# is checked like any other crate. Every license above is permissive: nothing in the dependency
# tree is GPL/LGPL/AGPL/MPL/EPL, so the tree does not constrain an Apache-2.0 (or MIT) choice
# for mc-spine. Keep copyleft licenses OFF this list; adding one should be a deliberate decision
# (see LICENSING.md).

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
