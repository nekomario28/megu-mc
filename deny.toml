# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#   cargo deny check advisories licenses bans sources
# The license allowlist below was derived from `cargo metadata --all-features` for the
# committed Cargo.lock; it lists licenses that actually occur, nothing speculative.
# (78 crates, last checked 2026-10-26 with cargo-deny 0.20.2.)
# It describes what the dependency tree contains and is NOT a legal opinion (see THIRD_PARTY.md).

[graph]
# Check the whole tree, including the optional JNI adapters (java-compat etc.).
all-features = true

[advisories]
version = 2
# Yanked crates fail the check; unmaintained/unsound advisories also fail (default scope: workspace).
yanked = "deny"
ignore = [
    # Minecraft Java Protocol 767 mandates 1024-bit RSA PKCS#1 v1.5 for the
    # online-mode login encryption handshake. Megu generates a fresh ephemeral
    # keypair per server boot (no persistent RSA key), and no fixed 0.9.x
    # release of `rsa` exists yet.
    { id = "RUSTSEC-2023-0071", reason = "Minecraft protocol 767 requires RSA PKCS#1 v1.5 for ephemeral per-boot login handshake; no patched rsa 0.9.x release exists" },
    # ttf-parser 0.25.1 is an unavoidable transitive dependency of the client-gpu
    # winit stack: winit 0.30 -> sctk-adwaita (Wayland CSD) -> ab_glyph ->
    # owned_ttf_parser -> ttf-parser. The advisory is informational-only
    # (unmaintained, no CVE/security impact) and names no patched release; the
    # suggested skrifa migration has to happen upstream in ab_glyph/sctk-adwaita.
    { id = "RUSTSEC-2026-0192", reason = "informational unmaintained notice only; ttf-parser is transitive via winit -> sctk-adwaita -> ab_glyph and has no patched release" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",  # arrayref 0.3.9 via tiny-skia/winit (client-gpu)
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA bundle)
    "LGPL-3.0-or-later",   # root crate and workspace crates (LICENSE)
    # symphonia 0.5.5 (client-gpu audio decoding) is MPL-2.0: weak file-level
    # copyleft, fully compatible with Megu's LGPL-3.0-or-later.
    "MPL-2.0",
]
confidence-threshold = 0.93

# The root crate and first-party code use `LGPL-3.0-or-later` (Cargo.toml,
# LICENSING.md, LICENSE). docs/COPYING.GPL carries GPLv3 terms referenced by LGPLv3.
# Every third-party Rust dependency in Cargo.lock is permissive
# (MIT / Apache-2.0 / ISC / BSD-3-Clause / Zlib / 0BSD / Unlicense / Unicode-3.0 / CDLA-Permissive-2.0),
# which is compatible with LGPL-3.0-or-later (see LICENSING.md).

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
