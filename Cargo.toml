[package]
name = "mc-spine"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
[profile.release]
opt-level = 3
lto = true
strip = true

# Line tables keep file:line in backtraces. Full debug info made the suite binary
# 136 MiB (measured 2026-11-16), and `src/test_support.rs` re-executes that binary
# once per isolated test, so its size is paid on every one of those runs.
[profile.dev]
debug = "line-tables-only"

# The suite is compute-bound, not compile-bound: a cold `cargo test --no-run`
# took 12.96 s while the suite itself took 623.72 s (measured 2026-11-16). Level 1
# keeps `debug-assertions` and `overflow-checks` on, so the assertions the tests
# rely on still fire; it only stops the inner loops from being unoptimised.
[profile.test]
opt-level = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[features]
# Opt-in CI-only Java fixtures; tests hard-fail without native files.
native-oracle = []
java-compat = ["dep:jni"]
fabric-probe = ["java-compat"]
neoforge-events = ["java-compat"]
# Opt-in production bridge to the local mod adapters (`src/mod_offload_bridge.rs`,
# `include!`d behind this cfg). All three crates are path-local with zero
# crates-io dependencies, so default builds keep an unchanged dependency graph.
create-offload = ["dep:mod-adapter-core", "dep:create-adapter"]

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
jni = { version = "0.21.1", features = ["invocation"], optional = true }
mod-adapter-core = { path = "mod-adapter-core", optional = true }
create-adapter = { path = "create-adapter", optional = true }
signal-hook = "0.4.4"
ureq = { version = "3.4.2", features = ["rustls"] }
