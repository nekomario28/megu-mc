[package]
name = "megu"
version = "0.1.0-beta.2"
edition = "2021"
license = "LGPL-3.0-or-later"
# Never published: wildcard path dependencies below are legal only for a
# non-published crate (crates.io forbids path dependencies), which is what
# `allow-wildcard-paths` in deny.toml keys on.
publish = false
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Line tables keep file:line in backtraces. Full debug info made the suite binary
# 136 MiB (measured 2026-11-16), and `src/test_support.rs` re-executes that binary
# once per isolated test, so its size is paid on every one of those runs.
[profile.dev]
debug = "line-tables-only"
codegen-units = 2
incremental = false

# The suite is compute-bound, not compile-bound: a cold `cargo test --no-run`
# took 12.96 s while the suite itself took 623.72 s (measured 2026-11-16). Level 1
# keeps `debug-assertions` and `overflow-checks` on, so the assertions the tests
# rely on still fire; it only stops the inner loops from being unoptimised.
# Single codegen-unit + non-incremental keeps monolithic `rustc --test` RSS
# bounded (~1.3-1.8 GiB) instead of spiking 4-10 GiB across parallel LLVM CGUs.
[profile.test]
opt-level = 1
debug = "line-tables-only"
codegen-units = 1
incremental = false

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[features]
# Opt-in CI-only Java fixtures; tests hard-fail without native files.
native-oracle = []
java-compat = ["dep:jni"]
fabric-probe = ["java-compat"]
neoforge-events = ["java-compat"]
# Opt-in production bridge to the local mod adapters (`src/mod_offload_bridge.rs`,
# `include!`d behind this cfg). All three crates are path-local with zero
# crates-io dependencies, so default builds keep an unchanged dependency graph.
create-offload = ["dep:mod-adapter-core", "dep:create-adapter"]
# Opt-in live root integration bridge (`src/live_mod_bridge.rs`, `include!`d
# unconditionally; every symbol inside is `#[cfg]`-gated so default builds keep
# an unchanged dependency graph). All four crates are path-local, already in
# `Cargo.lock`, and already copied by `tools/mutation_check.sh`'s INPUTS — this
# feature adds dependency *edges* only, never new crates.
mod-suite = [
    "dep:mod-adapter-core",
    "dep:create-adapter",
    "dep:mod-offload",
    "dep:megu-state-store",
]

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
jni = { version = "0.21.1", features = ["invocation"], optional = true }
mod-adapter-core = { path = "mod-adapter-core", optional = true }
create-adapter = { path = "create-adapter", optional = true }
# `megu-core` is a default dependency: `worldgen`'s `bg_scope!` batches run on
# its resident `MeguTaskPool` in every build, not only under `mod-suite`.
megu-core = { path = "core" }
megu-server-files = { path = "server-files" }
megu-state-store = { path = "state-store", optional = true }
mod-offload = { path = "mod-offload", optional = true }
ureq = { version = "3.4.2", features = ["rustls"] }
rsa = "=0.9.10"
rand = "=0.8.8"

# Unix-only: `src/main.rs` arms the SIGTERM/SIGINT save handler through
# signal-hook's `Signals` iterator. Windows exits through the stdin `/stop`
# console loop instead, so the crate must not enter a Windows build graph.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"
