[package]
name = "megu-server-files"
version = "0.1.0"
edition = "2021"
publish = false
license = "LGPL-3.0-or-later"
description = "Standalone Vanilla server files for megu: server.properties, eula.txt, ops/whitelist/bans, usercache.json and atomic persistence"

# Zero external dependencies by contract: this crate is the clean-room server
# files core the dedicated-server lanes converge on, so it must build on pure
# `std`. `megu-core` is the workspace-internal leaf crate (the canonical
# TargetVersion registry), not a crates.io dependency.
[dependencies]
megu_core = { package = "megu-core", path = "../core" }

[[bin]]
name = "megu-admin"
path = "src/bin/server_init.rs"

[[bin]]
name = "megu-init"
path = "src/bin/megu_init.rs"

[[bin]]
name = "megu-installer"
path = "src/bin/megu_installer.rs"

# Standalone manifest: the root `[profile.release]` is not inherited, so the
# shipped binary opts into full optimisation, LTO and symbol stripping itself.
[profile.release]
opt-level = 3
lto = true
strip = true
