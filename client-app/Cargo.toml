[package]
name = "megu-client"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Standalone native Minecraft 1.21.1 (Protocol 767) client executable for megu"
publish = false

[lib]
name = "megu_client"
path = "src/lib.rs"

[[bin]]
name = "megu-client"
path = "src/main.rs"

[dependencies]
megu_kernel = { package = "megu-kernel", path = "../client-kernel" }
megu_client_mesh = { package = "megu-client-mesh", path = "../client-port" }
megu_proto = { package = "megu-proto", path = "../proto" }
symphonia = { version = "=0.5.5", default-features = false, features = ["ogg", "vorbis"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"
codegen-units = 8
incremental = false

[profile.test]
debug = "line-tables-only"
codegen-units = 4
incremental = false
